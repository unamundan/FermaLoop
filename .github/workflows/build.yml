name: Build FermaLoop Executables

# Runs on GitHub's actual macOS and Windows machines and produces
# self-contained double-clickable apps with ffmpeg bundled inside --
# nothing for the end user to install. Trigger it either by pushing to
# main, or manually from the "Actions" tab ("Run workflow" button) --
# no terminal needed either way.

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install numpy pyinstaller sounddevice tkinterdnd2 Pillow

      - name: Download static ffmpeg (Windows build)
        shell: pwsh
        run: |
          # Primary source: BtbN/FFmpeg-Builds' "latest" release, hosted on
          # GitHub's own infrastructure (far more reliable for CI than a
          # personal site) with a permanently-stable filename by design.
          # Falls back to gyan.dev (a personal site that can 503 under load,
          # as happened here) if the primary source is ever unavailable.
          $ProgressPreference = 'SilentlyContinue'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          $sources = @(
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip",
            "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          )

          $downloaded = $false
          foreach ($url in $sources) {
            Write-Host "Trying $url ..."
            try {
              Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip -UseBasicParsing
            } catch {
              Write-Host "Invoke-WebRequest failed ($_), retrying with curl.exe..."
              curl.exe -L -o ffmpeg.zip $url
            }
            if ((Test-Path ffmpeg.zip) -and (Get-Item ffmpeg.zip).Length -ge 1MB) {
              Write-Host "Downloaded successfully from $url"
              $downloaded = $true
              break
            }
            Write-Host "Download from $url failed or was suspiciously small -- trying next source."
            Remove-Item ffmpeg.zip -ErrorAction SilentlyContinue
          }

          if (-not $downloaded) {
            Write-Error "All ffmpeg download sources failed. Tried: $($sources -join ', ')"
            exit 1
          }

          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_extracted
          $ffmpegExe = Get-ChildItem -Path ffmpeg_extracted -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          if (-not $ffmpegExe) {
            Write-Error "ffmpeg.exe not found inside the downloaded archive -- its internal folder structure may have changed."
            exit 1
          }
          Copy-Item $ffmpegExe.FullName -Destination .\ffmpeg.exe

      - name: Build self-contained executable
        run: >
          pyinstaller --onedir --windowed --name FermaLoop
          --add-binary "ffmpeg.exe;."
          --collect-all sounddevice --collect-all tkinterdnd2
          FermaLoop.py
        # --onedir, not --onefile: a --onefile build re-extracts its
        # entire bundled Python runtime + dependencies to a fresh temp
        # directory on EVERY launch, before the app's own code even
        # starts running -- this was confirmed as the actual source of
        # a multi-second startup delay (measured: the app's own code
        # runs in well under half a second once it actually starts;
        # the delay was happening entirely before that, in PyInstaller's
        # own bootstrap). --onedir ships everything already unpacked, so
        # there's nothing left to extract at launch.

      - name: Zip the app folder
        shell: pwsh
        run: Compress-Archive -Path dist\FermaLoop -DestinationPath dist\FermaLoop-Windows.zip

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: FermaLoop-Windows
          path: dist/FermaLoop-Windows.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install numpy pyinstaller sounddevice tkinterdnd2 Pillow

      - name: Download static ffmpeg (macOS build)
        run: |
          curl -L -o ffmpeg.zip https://evermeet.cx/ffmpeg/getrelease/zip
          unzip -o ffmpeg.zip -d ffmpeg_extracted
          find ffmpeg_extracted -type f -name ffmpeg -exec cp {} ./ffmpeg \;
          chmod +x ffmpeg

      - name: Build self-contained .app
        run: >
          pyinstaller --onedir --windowed --name FermaLoop
          --add-binary "ffmpeg:."
          --collect-all sounddevice --collect-all tkinterdnd2
          FermaLoop.py
        # --onedir, not --onefile: see the matching note in the Windows
        # job above -- this is what was actually behind the multi-second
        # startup delay, confirmed by direct timing (the app's own code
        # completes in well under half a second once running; the delay
        # was entirely PyInstaller's own per-launch extraction, which
        # this eliminates by shipping everything already unpacked inside
        # the .app bundle).

      - name: Zip the .app bundle
        run: cd dist && zip -r FermaLoop-Mac.zip FermaLoop.app

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: FermaLoop-Mac
          path: dist/FermaLoop-Mac.zip
